# Design tokens from design-system/autosentinel/MASTER.md
[theme]
base = "light"
primaryColor = "#1E3A8A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1E40AF"
borderColor = "#CBD5E1"
